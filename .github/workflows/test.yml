# Verifies that every language's harness works on a fresh clone:
# dependencies install, the code compiles/type-checks, and the always-passing
# "harness smoke" test runs. The full suites are NOT run here because the repo
# ships unimplemented stubs (every other test is expected to fail until a
# candidate implements the rate limiter).
name: Harness check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, go, python, java, csharp, rust, ruby, kotlin]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        if: matrix.language == 'java' || matrix.language == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: ${{ matrix.language == 'java' && 'maven' || 'gradle' }}
          cache-dependency-path: ${{ matrix.language == 'java' && 'java/pom.xml' || 'kotlin/build.gradle.kts' }}

      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Ruby
        if: matrix.language == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install, compile, and run the harness smoke test
        env:
          TARGET_LANG: ${{ matrix.language }}
        run: ./scripts/verify.sh "$TARGET_LANG"
        timeout-minutes: 10
